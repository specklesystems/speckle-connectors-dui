version: 2
updates:
  # Pin updates of the shared workflows in specklesystems/.github, one pull
  # request per new tag there, with no cooldown. Each merges only after the
  # workflows it changes worked in speckle-next at the new pin (ADR-0002
  # rule 3, amendment of 2026-11-24, ENG-11742). Security updates are off
  # here, so `allow` keeps Dependabot off every other action.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-name: specklesystems/.github/*
    groups:
      dot-github:
        patterns:
          - specklesystems/.github/*
    cooldown:
      default-days: 7
      exclude:
        - specklesystems/.github/*
    commit-message:
      prefix: ci
