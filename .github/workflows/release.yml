name: Release

on:
  push:
    branches:
      - main
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true # other running workflows get cancelled on the same branch

permissions: {} # purposefully empty by default at workflow level, explicitly overridden for specific jobs below

jobs:
  get-version:
    uses: ./.github/workflows/get-version.yml
    with: {}
    secrets: {}
    permissions:
      contents: read
  lint:
    uses: ./.github/workflows/lint.yml
    with: {}
    secrets:
      TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
      TAILSCALE_OAUTH_CLIENT_AUDIENCE: ${{ secrets.TAILSCALE_OAUTH_CLIENT_AUDIENCE }}
    permissions:
      contents: read
      id-token: write # Tailscale OAuth federation for the tailnet npm registry
  build:
    uses: ./.github/workflows/build.yml
    needs:
      - get-version
      - lint
    with:
      PUBLISH: true
      IMAGE_VERSION_TAG: ${{ needs.get-version.outputs.IMAGE_VERSION_TAG }}
    secrets:
      HYPERDX_API_KEY: ${{ secrets.HYPERDX_API_KEY }}
      TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
      TAILSCALE_OAUTH_CLIENT_AUDIENCE: ${{ secrets.TAILSCALE_OAUTH_CLIENT_AUDIENCE }}
    permissions:
      contents: read
      packages: write # to be able to push images to ghcr.io
      id-token: write # Tailscale OAuth federation for the tailnet npm registry
  netlify:
    # Netlify production tracks main; tag builds ship the same commit through
    # the docker image + helm chart instead, so they skip the Netlify publish.
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/netlify.yml
    needs:
      - lint
    with:
      NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
      NETLIFY_CONTEXT: production
      PUBLISH_TO_PROD: true
    secrets:
      TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
      TAILSCALE_OAUTH_CLIENT_AUDIENCE: ${{ secrets.TAILSCALE_OAUTH_CLIENT_AUDIENCE }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    permissions:
      contents: read
      id-token: write # Tailscale OAuth federation for the tailnet npm registry
  publish:
    uses: ./.github/workflows/publish.yml
    needs:
      - build
      - get-version
    with:
      PUBLISH_TO_PROD: true
      IMAGE_VERSION_TAG: ${{ needs.get-version.outputs.IMAGE_VERSION_TAG }}
    secrets: {}
    permissions:
      contents: read
      packages: write # to be able to push helm charts to ghcr.io
